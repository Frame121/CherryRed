<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">CherryRed</title>
  <desc id="desc">Cherry-red crystalline C64 mark with a central GPU chip.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff536b"/>
      <stop offset=".48" stop-color="#d80a35"/>
      <stop offset="1" stop-color="#65091f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fff4f6"/>
      <stop offset=".45" stop-color="#ffc2ce"/>
      <stop offset="1" stop-color="#ff6681"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#31000c" flood-opacity=".5"/>
    </filter>
    <clipPath id="round"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
    <path d="M8 8H248V119L8 178Z" fill="url(#shine)"/>
    <path d="M8 8H248V248H8Z" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M158 72A64 64 0 1 0 158 184" fill="none" stroke="#4b0618" stroke-opacity=".55" stroke-width="23" stroke-linecap="square"/>
    <path d="M158 72A64 64 0 1 0 158 184" fill="none" stroke="url(#face)" stroke-width="20" stroke-linecap="square"/>
    <path d="M42 96L57 96M35 128L50 128M42 160L57 160" stroke="#fff0f3" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <rect x="91" y="91" width="74" height="74" rx="12" fill="#78091f" stroke="#ffb6c5" stroke-width="5"/>
    <rect x="102" y="102" width="52" height="52" rx="7" fill="url(#face)"/>
    <path d="M109 109L147 109L147 147Z" fill="#fff" opacity=".42"/>
    <path d="M112 80V91M128 76V91M144 80V91M112 165V176M128 165V180M144 165V176" stroke="#fff0f3" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M34 54L54 34" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
  <path d="M202 205L220 187" stroke="#ffb3c2" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
