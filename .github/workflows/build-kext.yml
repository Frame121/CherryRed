name: build-kext

# Builds Navi33Bringup.kext (RX 7600 bring-up scaffold) on a macOS runner so a
# Windows-side session can iterate without a booted macOS host. The firmware
# blobs come from the pinned linux-firmware commit and are hash-verified
# against the recorded FIRMWARE-PROVENANCE.md pins before the build. The built
# kext is published to the "kext-builds" branch (kext-latest/) so it can be
# pulled without authentication; the host CTest suites run after it and must
# not block the delivery.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  kext:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MacKernelSDK
        run: |
          tries=0
          until git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git; do
            tries=$((tries + 1))
            rm -rf MacKernelSDK
            if [ "$tries" -ge 4 ]; then
              echo "could not clone MacKernelSDK after $tries attempts" >&2
              exit 1
            fi
            sleep $((tries * 10))
          done

      - name: Fetch pinned linux-firmware amdgpu blobs
        run: |
          git clone --filter=blob:none --no-checkout \
            https://gitlab.com/kernel-firmware/linux-firmware.git linux-firmware
          cd linux-firmware
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          amdgpu/gc_11_0_2_*
          amdgpu/sdma_6_0_2*
          amdgpu/vcn_4_0_4*
          amdgpu/dcn_3_2_1_dmcub*
          amdgpu/psp_13_0_7_*
          amdgpu/smu_13_0_7*
          LICENSE.amdgpu
          EOF
          git checkout d0039fd797d7776d89f00c22c45754914a96706e

      - name: Copy and hash-verify the RX 7600 blob set
        run: |
          command -v zstd >/dev/null 2>&1 || brew install zstd
          sh tools/fetch-firmware-navi33.sh "$PWD/linux-firmware"

      - name: Host safety tests
        run: make -C src/navi33-bringup test

      - name: Build Navi33Bringup.kext
        run: |
          set -o pipefail
          make -C src/navi33-bringup MKSDK="$GITHUB_WORKSPACE/MacKernelSDK" all 2>&1 | tee kext-build.log

      - name: Publish the kext to the kext-builds branch
        if: success()
        run: |
          set -e
          git config user.name "kext-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B kext-builds "$GITHUB_SHA"
          git rm -rq --cached . 2>/dev/null || true
          rm -rf kext-latest
          mkdir -p kext-latest
          ditto -c -k --keepParent \
            src/navi33-bringup/build/Navi33Bringup.kext kext-latest/Navi33Bringup.kext.zip
          git add kext-latest
          # An unchanged kext stages nothing; that is success, not a failure.
          git diff --cached --quiet || git commit -m "CI kext build from ${GITHUB_SHA}"
          # kext-builds is a machine-generated artifact branch; its history
          # restarts at every source commit, so updates are force pushes.
          git push --force origin kext-builds

      - uses: actions/upload-artifact@v4
        with:
          name: Navi33Bringup-kext
          path: src/navi33-bringup/build/Navi33Bringup.kext
          if-no-files-found: error

      - name: CTest host suites (portable research core)
        run: |
          set -o pipefail
          {
            cmake -S src/navi33-research -B build/host-ctest -DCMAKE_BUILD_TYPE=Release
            cmake --build build/host-ctest --config Release -j 4
            ctest --test-dir build/host-ctest -C Release --output-on-failure
          } 2>&1 | tee host-ctest.log

      - name: Surface failing logs as annotations
        if: failure()
        run: |
          for f in kext-build.log host-ctest.log; do
            if [ -f "$f" ]; then
              grep -E "error|Error|FAILED|Failed|undefined" "$f" | head -8 | while IFS= read -r line; do
                echo "::error title=$f::$line"
              done
              if ! grep -qE "error|Error|FAILED|Failed|undefined" "$f"; then
                tail -8 "$f" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error title=$f-tail::$line"
                done
              fi
            fi
          done
